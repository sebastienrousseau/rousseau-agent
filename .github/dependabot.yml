version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Base-image digests in docker/Dockerfile* (L-28). Dependabot bumps a
  # `FROM image:tag@sha256:…` pin to the tag's new digest. The ARG-held
  # pins (DOTFILES_REF, tool versions and sums) are outside its reach:
  # see .github/workflows/dotfiles-pin.yml and the refresh notes in each
  # Dockerfile.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    labels:
      - dependencies
      - docker
