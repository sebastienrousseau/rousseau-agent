version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
    # One PR per family instead of one per module: the otel modules move
    # together, and so do the golang.org/x modules.
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Base-image digests in docker/Dockerfile* (L-28). Dependabot bumps a
  # `FROM image:tag@sha256:…` pin to the tag's new digest. The ARG-held
  # pins (DOTFILES_REF, tool versions and sums) are outside its reach:
  # see .github/workflows/dotfiles-pin.yml and the refresh notes in each
  # Dockerfile.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    labels:
      - dependencies
      - docker
    groups:
      docker:
        patterns:
          - "*"
    # A new Go minor or Node major changes the build toolchain, so it is
    # a deliberate change (go.mod's toolchain line, Node LTS timing), not
    # a weekly bump. Digest and patch updates still come through.
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
