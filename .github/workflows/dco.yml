# DCO enforcement — every PR commit must carry a Signed-off-by trailer
# (per the Developer Certificate of Origin, see CLA.md). Rejects at PR
# time rather than at merge time so contributors see the feedback while
# their branch is still local and easy to fix.
#
# On check failure, the workflow prints paste-ready remediation commands
# so the fix is one copy-paste away, not a stack-overflow trip.

name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    name: dco sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch the full PR range so we can inspect every commit,
          # not just the merge commit GitHub generates.
          fetch-depth: 0
      - name: verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          # `%H` = full hash, `%(trailers:key=Signed-off-by,valueonly)`
          # gives every Signed-off-by value on the commit (or empty
          # when none present).
          #
          # NOTE: git-log's `%(trailers:...)` format ALWAYS appends a
          # trailing newline after the trailer value, producing an
          # empty line between every commit's record. Without the
          # `awk` filter below, the while-loop reads those blank
          # lines as commits with empty SHA + empty trailer and
          # every real commit gets flagged as missing.
          # Bot-authored commits are exempt from DCO: dependabot and
          # github-actions have no human contributor to attest, and
          # both are already GPG-signed by GitHub's own identity. This
          # matches the pattern most CNCF/LF projects use (e.g.
          # kubernetes/kubernetes exempts dependabot from DCO).
          #
          # Format ordering matters: `%an` MUST come before
          # `%(trailers:...)` — the trailer field appends its own
          # newline, so any format field placed AFTER it appears on
          # a subsequent line and the read-loop assigns it wrong.
          bot_authors="^(dependabot\[bot\]|dependabot-preview\[bot\]|github-actions\[bot\])$"
          while IFS=$'\t' read -r sha author trailers; do
              if [ -z "$sha" ]; then
                  continue # skip blank lines between records
              fi
              if [[ "$author" =~ $bot_authors ]]; then
                  continue # bot commit — exempt
              fi
              if [ -z "$trailers" ]; then
                  echo "::error::commit $sha (author: $author) is missing a Signed-off-by trailer"
                  bad=$((bad + 1))
              fi
          done < <(git log --format='%H%x09%an%x09%(trailers:key=Signed-off-by,valueonly)' "$BASE_SHA..$HEAD_SHA")
          if [ "$bad" -gt 0 ]; then
              cat >&2 <<'EOF'

          DCO check failed: $bad commit(s) missing Signed-off-by.

          Fix (all commits since the base branch):

            git rebase --signoff $BASE_SHA
            git push --force-with-lease

          Or, for the most recent commit only:

            git commit --amend --signoff --no-edit
            git push --force-with-lease

          See CLA.md for what Signed-off-by attests to and why the
          project requires it.
          EOF
              exit 1
          fi
          echo "dco: ok — every PR commit carries Signed-off-by"
