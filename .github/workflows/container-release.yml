# Build and publish container images to ghcr.io on tag push.
#
# Two flavours per tag:
#   ghcr.io/sebastienrousseau/rousseau-agent:<tag>              (full runtime;
#                                                                docker/Dockerfile)
#   ghcr.io/sebastienrousseau/rousseau-agent:distroless-<tag>   (minimal;
#                                                                docker/Dockerfile.distroless)
#
# Both are:
#   - Multi-arch (linux/amd64, linux/arm64) built on NATIVE runners
#     (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64). QEMU is
#     no longer used — the v0.0.9 SIGILL flake (`npm install
#     @anthropic-ai/claude-code` under emulation) and the ~80-min
#     full-flavour arm64 build time both went away with this split.
#   - Cosign-signed keylessly (GitHub OIDC → Sigstore Fulcio → transparency log)
#   - Attested with SLSA build provenance
#
# Verification:
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/sebastienrousseau/rousseau-agent/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/sebastienrousseau/rousseau-agent:v0.0.1
#
# Flow (tag path):
#   1. `build` matrix (4 jobs: {full,distroless} × {amd64,arm64})
#      pushes each single-arch image to GHCR by digest only,
#      uploads the digest as an artifact.
#   2. `merge-and-sign` matrix (2 jobs: {full,distroless}) downloads
#      the two digests for its flavour, creates the multi-arch
#      manifest with `docker buildx imagetools create`, then signs +
#      attests + SBOM + scans the merged manifest.
#
# Flow (PR / non-tag): the `pr-scan` job builds amd64 locally on
# ubuntu-latest, loads it into the daemon, and scans. It never
# pushes. This preserves the pre-refactor sanity check.

name: container release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/container-release.yml"
      - ".grype.yaml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
  schedule:
    # Weekly rebuild. A daemon image that was clean at release does not
    # stay clean: CVEs are disclosed against packages already inside it.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  # contents:write is needed by anchore/sbom-action@v0 on tag push
  # — it uploads the generated SPDX SBOM as a release asset via the
  # GitHub Releases API. With contents:read the upload fails
  # "Resource not accessible by integration" (v0.0.4 → v0.0.6
  # container releases all hit this).
  contents: write
  packages: write
  # id-token for cosign keyless + SLSA attestations
  id-token: write
  # attestations for SLSA build provenance
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------
  # PR / non-tag path: build amd64 only, load locally, scan. The point
  # is to catch Dockerfile regressions and CVE regressions on every PR
  # without spending 20+ min on a full multi-arch matrix that we
  # aren't going to publish anyway.
  # -------------------------------------------------------------------
  pr-scan:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: full
            dockerfile: docker/Dockerfile
            gate: true
          - flavour: distroless
            dockerfile: docker/Dockerfile.distroless
            gate: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute build date
        id: date
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build amd64 (load locally for scan)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: rousseau-agent-${{ matrix.flavour }}:edge
          build-args: |
            VERSION=edge-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            APK_REFRESH=${{ steps.date.outputs.day }}
          cache-from: type=gha,scope=${{ matrix.flavour }}-amd64
          cache-to: type=gha,scope=${{ matrix.flavour }}-amd64,mode=max

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: rousseau-agent-${{ matrix.flavour }}:edge
          format: spdx-json
          artifact-name: rousseau-agent-${{ matrix.flavour }}.spdx.json

      # BLOCKING for both flavours at high and above. Exceptions live
      # in .grype.yaml, each with its reason and removal condition.
      - name: Scan for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rousseau-agent-${{ matrix.flavour }}:edge
          severity-cutoff: high
          fail-build: ${{ matrix.gate }}
          output-format: table

  # -------------------------------------------------------------------
  # Tag path: build each arch on its native runner, push by digest.
  # No tags are attached here — the merge job assembles the multi-arch
  # manifest and applies the semantic tag (v0.0.x, latest,
  # distroless-v0.0.x, distroless-latest).
  # -------------------------------------------------------------------
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: full
            dockerfile: docker/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - flavour: full
            dockerfile: docker/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - flavour: distroless
            dockerfile: docker/Dockerfile.distroless
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - flavour: distroless
            dockerfile: docker/Dockerfile.distroless
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute build date
        id: date
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Push by digest only — no tag attached yet. The merge job
      # collects the per-arch digests and creates the multi-arch
      # manifest with the semantic tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            APK_REFRESH=${{ steps.date.outputs.day }}
          cache-from: type=gha,scope=${{ matrix.flavour }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.flavour }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # Filename is the SHA hex; contents don't matter — the
          # merge job only needs the list of digest strings.
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.flavour }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  # Merge per-arch digests into the multi-arch manifest, then sign +
  # attest + SBOM + scan the final result. One job per flavour.
  # -------------------------------------------------------------------
  merge-and-sign:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: full
            tag_prefix: ""
            gate: true
          - flavour: distroless
            tag_prefix: "distroless-"
            gate: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download digests for this flavour
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-${{ matrix.flavour }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The tag prefix (distroless- or empty) is baked in via
          # `flavor.prefix` so users get semantic tags like
          # `distroless-v0.0.1` without us writing them out by hand.
          flavor: |
            prefix=${{ matrix.tag_prefix }}
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ matrix.tag_prefix }}latest

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # `docker/metadata-action` exposes the tag list as JSON in
          # $DOCKER_METADATA_OUTPUT_JSON — turn that into `-t <tag>`
          # args, then append `<image>@sha256:<digest>` for each
          # per-arch digest we downloaded. `imagetools create`
          # atomically publishes the manifest list.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect merged manifest for digest
        id: inspect
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(printf '%s\n' "$TAGS" | head -n1)
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{ json .Manifest }}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the merged manifest (keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }}
          format: spdx-json
          artifact-name: rousseau-agent-${{ matrix.flavour }}.spdx.json

      # BLOCKING for both flavours at high and above (exceptions in
      # .grype.yaml). Grype scans one arch of the multi-arch
      # manifest by default; the amd64 image is what most operators
      # will pull first.
      - name: Scan for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }}
          severity-cutoff: high
          fail-build: ${{ matrix.gate }}
          output-format: table
