name: soak

# Nightly 5h30m soak on main + 30-minute soak on every PR.
#
# Why 5h30m and not 24h: GitHub-hosted runners hard-cap a single job
# at 6 hours regardless of timeout-minutes, so the former 24h nightly
# was cancelled at the 6h mark every night with no report uploaded.
# A true 24h soak needs a self-hosted runner — dispatch with
# duration=24h once one exists.
# Runs the harness in test/integration/soak that drives synthetic
# workload against a fake provider while a Monitor samples runtime +
# FD counts, asserts leak invariants at the end, and uploads a
# markdown report as an artefact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      duration:
        description: "Override SOAK_DURATION (Go duration, e.g. 1h30m)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  soak:
    name: soak (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 350       # under the 6h hosted-runner hard cap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The dispatch input arrives through env and must be a Go
      # duration before it is written anywhere (L-27): interpolating
      # ${{ inputs.duration }} into the script let it inject shell.
      - name: Pick duration
        id: pick
        env:
          IN_DURATION: ${{ inputs.duration }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$IN_DURATION" ]; then
            [[ "$IN_DURATION" =~ ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$ ]] \
              || { echo "::error::duration must be a Go duration such as 1h30m"; exit 1; }
            printf 'duration=%s\n' "$IN_DURATION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) echo "duration=5h30m" >> "$GITHUB_OUTPUT" ;;
            push)                        echo "duration=10m" >> "$GITHUB_OUTPUT" ;;
            pull_request)                echo "duration=30m" >> "$GITHUB_OUTPUT" ;;
            *)                           echo "duration=5m"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run soak
        env:
          SOAK_DURATION: ${{ steps.pick.outputs.duration }}
          SOAK_REPORT: /tmp/soak-report.md
        run: |
          echo "Running soak for $SOAK_DURATION"
          go test -count=1 -timeout 5h50m ./test/integration/soak/...

      - name: Upload report artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-report-${{ github.run_id }}
          path: /tmp/soak-report.md
          retention-days: 30
