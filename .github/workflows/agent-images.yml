# Build and publish the agent container estate to ghcr.io.
#
#   ghcr.io/sebastienrousseau/rousseau-agent:base-<tag>
#   ghcr.io/sebastienrousseau/rousseau-agent:builder-<tag>
#
# This is deliberately SEPARATE from container-release.yml, which ships
# the runtime daemon. Three reasons:
#
#   1. Ordering. builder derives FROM base, so the two cannot be matrix
#      siblings -- base must publish before builder starts.
#   2. Architecture. The runtime images are multi-arch. The builder
#      pins amd64-only release binaries (yq_linux_amd64,
#      syft_..._linux_amd64, act_Linux_x86_64), so it is amd64-only
#      until those pins gain verified arm64 checksums. Publishing a
#      silently-amd64-only "multi-arch" image is worse than declaring it.
#   3. Cadence. Dev images want a weekly rebuild so base-image CVE fixes
#      flow without waiting for a release tag.
#
# Verification:
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/sebastienrousseau/rousseau-agent/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/sebastienrousseau/rousseau-agent:builder-edge

name: agent images

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths:
      - "docker/Dockerfile.base"
      - "docker/Dockerfile.builder"
      - ".github/workflows/agent-images.yml"
  schedule:
    # Weekly rebuild so upstream base-image security fixes land without
    # waiting for a release tag.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64

jobs:
  # -------------------------------------------------------------------
  # base -- shared foundation. Must complete before builder starts.
  # -------------------------------------------------------------------
  base:
    name: build base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        # Skipped on pull_request: forks have no package:write, and a PR
        # should validate that the image BUILDS, not publish it.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=base-
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.event_name != 'push' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-base
          cache-to: type=gha,scope=agent-base,mode=max

      - name: Expose pinned base reference for the builder job
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR builds stay local; builder rebuilds base from source.
            echo "image=" >> "$GITHUB_OUTPUT"
          else
            # Pin by DIGEST, not tag. A tag is mutable; if base is
            # rebuilt between these two jobs, a tag reference would
            # silently produce a builder image whose base is not the
            # one this run tested.
            echo "image=${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Generate SLSA build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # -------------------------------------------------------------------
  # builder -- polyglot build environment, derives FROM base.
  # -------------------------------------------------------------------
  builder:
    name: build builder
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # Local registry service for the PR path. The docker-container
    # buildx driver runs in an isolated container that does NOT share
    # the host docker daemon's image store — so `load: true` from a
    # prior step is invisible to a subsequent `docker buildx build`.
    # Pushing base to a real registry (localhost:5000) is the standard
    # way to hand an image between chained buildx invocations without
    # driver gymnastics.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # network=host is what lets the docker-container driver reach
          # the registry service on the runner's localhost:5000.
          driver-opts: network=host

      # On PRs the base image was never pushed to ghcr, so publish it
      # into the local registry service where the builder step can pull
      # it. Uses the same insecure-http registry buildkit is talking to
      # through --network host.
      - name: Rebuild base into local registry (pull_request only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: localhost:5000/agent-base:local
          cache-from: type=gha,scope=agent-base

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=builder-
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.event_name != 'push' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.builder
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Non-PR: pin BASE_IMAGE to the digest from the base job.
          # PR: point BASE_IMAGE at the local registry copy above.
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.image || 'localhost:5000/agent-base:local' }}
          cache-from: type=gha,scope=agent-builder
          cache-to: type=gha,scope=agent-builder,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Generate SLSA build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # -------------------------------------------------------------------
  # Supply-chain gate.
  #
  # Scoped to non-PR events because it scans BY REGISTRY REFERENCE, and
  # PR builds are never pushed -- there is no digest to pull. The
  # trade-off is real: a PR introducing a High/Critical CVE is caught on
  # merge to the default branch and on the weekly rebuild, not in the
  # PR itself. Closing that gap means exporting the PR image as an OCI
  # archive and scanning the file, which is a larger change than this
  # one is scoped for.
  # -------------------------------------------------------------------
  scan:
    name: sbom and vulnerability scan
    needs: builder
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.builder.outputs.digest }}
          format: spdx-json
          artifact-name: agent-builder.spdx.json

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.builder.outputs.digest }}
          severity-cutoff: high
          fail-build: true
