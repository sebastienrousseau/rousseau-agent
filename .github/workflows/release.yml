name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed for cosign keyless signing via the GitHub Actions OIDC
  # token — Fulcio issues a short-lived cert against this identity
  # instead of requiring a long-lived key + password.
  id-token: write
  # Needed so cosign can push signatures to the GHCR OCI registry
  # for container-image signing.
  packages: write

jobs:
  # The Helm chart's appVersion picks the image tag a default install
  # runs (L-31). Refuse to release when it does not name this tag, so
  # the chart can never again default to a months-old image.
  chart-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Chart appVersion matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart=deploy/helm/rousseau-agent/Chart.yaml
          app=$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$chart")
          if [ "$app" != "$TAG" ]; then
            echo "::error file=$chart::appVersion '$app' does not match tag '$TAG'; bump it before tagging"
            exit 1
          fi
          echo "appVersion $app matches $TAG"

  goreleaser:
    needs: [chart-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          # No module/build cache on the release path (L-30): a cache
          # written by a main or PR run must not feed a signed release.
          cache: false
      # goreleaser's `sboms:` block invokes syft to produce a
      # CycloneDX SBOM per archive artifact. syft isn't preinstalled
      # on ubuntu-latest runners, so we pull it before invoking
      # goreleaser — the alternative is dropping SBOMs, which would
      # regress the supply-chain story (README claims SBOM-per-release).
      - name: install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # cosign for goreleaser's `signs:` block. Keyless mode signs
      # via the Actions OIDC identity — no long-lived key or
      # password, transparent Sigstore log entry per artifact.
      #
      # cosign stays on v2 here: v3 writes a single bundle by default and
      # ignores the --output-signature/--output-certificate flags that
      # .goreleaser.yaml uses, so v0.0.13's signing step failed with
      # "create bundle file: open : no such file or directory".
      # install.sh and SECURITY.md verify checksums.txt.sig + .pem, so a
      # move to the bundle format has to change them together.
      - name: install cosign (keyless artifact signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          # Pinned: the release path must not change under us between tags.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA subjects are the archives GoReleaser just built and shipped
      # (L-29). They used to be hashed from a separate rebuild in
      # slsa.yml with different flags and names, so the provenance
      # attested binaries that were never published. Each digest is
      # cross-checked against GoReleaser's checksums.txt first.
      - name: Hash release archives for provenance
        id: hashes
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(rousseau-agent_*.tar.gz rousseau-agent_*.zip rousseau-agent-lite_*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no release archives in dist/"
            exit 1
          fi
          sha256sum "${archives[@]}" > provenance-subjects.txt
          while read -r sum name; do
            grep -qxF "$sum  $name" checksums.txt \
              || { echo "::error::$name: digest not in checksums.txt"; exit 1; }
          done < provenance-subjects.txt
          cat provenance-subjects.txt
          printf 'hashes=%s\n' "$(base64 -w0 < provenance-subjects.txt)" >> "$GITHUB_OUTPUT"
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}

  # SLSA Level 3 provenance over the shipped archives, uploaded to the
  # same release (replaces slsa.yml). Verify a download with:
  #   slsa-verifier verify-artifact \
  #     --provenance-path multiple.intoto.jsonl \
  #     --source-uri github.com/sebastienrousseau/rousseau-agent \
  #     --source-tag <tag> \
  #     rousseau-agent_<version>_<os>_<arch>.tar.gz
  provenance:
    needs: [goreleaser]
    permissions:
      # OIDC token for the provenance signature, run metadata, and the
      # .intoto.jsonl upload to the release.
      id-token: write
      contents: write
      actions: read
    # Referenced by tag, not SHA, on purpose: the SLSA generator
    # verifies its own ref and refuses to run when pinned by SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
