name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed for cosign keyless signing via the GitHub Actions OIDC
  # token — Fulcio issues a short-lived cert against this identity
  # instead of requiring a long-lived key + password.
  id-token: write
  # Needed so cosign can push signatures to the GHCR OCI registry
  # for container-image signing.
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      # goreleaser's `sboms:` block invokes syft to produce a
      # CycloneDX SBOM per archive artifact. syft isn't preinstalled
      # on ubuntu-latest runners, so we pull it before invoking
      # goreleaser — the alternative is dropping SBOMs, which would
      # regress the supply-chain story (README claims SBOM-per-release).
      - name: install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0
      # cosign for goreleaser's `signs:` block. Keyless mode signs
      # via the Actions OIDC identity — no long-lived key or
      # password, transparent Sigstore log entry per artifact.
      - name: install cosign (keyless artifact signing)
        uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
