name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        # Enforces a 95% repo-wide floor AND a 95% per-package floor.
        #
        # The previous floor was 75%, justified by WebSocket dial paths
        # (Slack Socket Mode, Discord Gateway, whatsmeow), signal-cli
        # subprocess management and cobra RunE closures being "testable
        # only with a dedicated network fake". Those fakes now exist, so
        # the floor moves to match reality.
        #
        # Exemptions live in scripts/coverage-gate.sh, are listed one
        # package at a time with a reason, and the script reports any
        # that have become unnecessary.
        run: scripts/coverage-gate.sh coverage.out 95 95

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [vet, lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go build -trimpath ./...
