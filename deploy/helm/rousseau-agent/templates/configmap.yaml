{{- $config := include "rousseau-agent.config" . -}}
{{- if $config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rousseau-agent.fullname" . }}-config
  labels:
    {{- include "rousseau-agent.labels" . | nindent 4 }}
data:
  # Mounted at /etc/rousseau/config.yaml and passed to the daemon with
  # --config (it does not look there on its own). Keeping the file name
  # matched to the on-disk default lets operators troubleshoot with the
  # same path they'd `podman run --volume` in.
  config.yaml: |-
    {{- $config | nindent 4 }}
{{- end -}}
