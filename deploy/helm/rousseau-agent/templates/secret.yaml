{{- if .Values.licence.value -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rousseau-agent.fullname" . }}-licence
  labels:
    {{- include "rousseau-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed via envFrom on the Deployment. The env-var name matches
  # license.DefaultEnvVar in internal/license/license.go — do not
  # rename without updating both sides in the same PR.
  ROUSSEAU_LICENSE_KEY: {{ .Values.licence.value | quote }}
{{- end -}}
