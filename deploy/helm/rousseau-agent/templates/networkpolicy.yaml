{{- if .Values.networkPolicy.enabled -}}
# Rendered only when networkPolicy.enabled=true; needs a CNI that
# enforces NetworkPolicy. Ingress: the metrics port, from metricsFrom
# peers only (none listed → no ingress). Egress: DNS, TCP to
# egressPorts on any address, plus extraEgress rules verbatim.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rousseau-agent.fullname" . }}
  labels:
    {{- include "rousseau-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rousseau-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.metricsFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egressPorts }}
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
