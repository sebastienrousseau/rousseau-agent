apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rousseau-agent.fullname" . }}
  labels:
    {{- include "rousseau-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rousseau-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rousseau-agent.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods when the config or licence changes so operators
        # get "kubectl apply" semantics without manually restarting.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.licence.value }}
        checksum/licence: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rousseau-agent.serviceAccountName" . }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: rousseau-agent
          image: {{ include "rousseau-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - {{ .Values.command | quote }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.licence.path .Values.env }}
          env:
            {{- if .Values.licence.path }}
            # File-based licence path — the daemon prefers env when
            # both are set, so this is a fallback for CSI / vault-
            # injected licences that never touch env.
            - name: ROUSSEAU_LICENSE_FILE
              value: {{ .Values.licence.path | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.licence.value .Values.envFromSecret }}
          envFrom:
            {{- if .Values.licence.value }}
            - secretRef:
                name: {{ include "rousseau-agent.fullname" . }}-licence
            {{- end }}
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/rousseau
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: state
              mountPath: /var/lib/rousseau
            {{- end }}
            # /tmp is writable so the daemon can spool voice-note
            # transcription buffers even when the root FS is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "rousseau-agent.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "rousseau-agent.fullname" . }}{{ end }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
