# grype configuration — vulnerability-gate exceptions.
#
# Read this before adding an entry. Every rule here is a vulnerability
# somebody decided not to fix, so each one states what it is, why it
# cannot be fixed here, and what would let it be removed.
#
# The gate itself lives in .github/workflows/agent-images.yml and
# .github/workflows/container-release.yml at severity-cutoff: high.
#
# SCOPE: most exceptions exist for the BUILDER image, which is a
# development environment. It holds no credentials, exposes no network
# service, and is not what runs in production. The runtime images
# (docker/Dockerfile, .distroless, .lite) hold a WhatsApp session and
# Claude OAuth tokens; anything found in them is a real finding to act
# on. The only runtime exceptions (last section) are vulnerabilities
# with NO fixed version anywhere upstream, and verified false
# positives; the no-fix rules expire by themselves the day a fix ships.

ignore:
  # ---------------------------------------------------------------
  # 1. Vendored upstream release binaries.
  #
  # The builder installs yq, syft, grype and act as PINNED, SHA256-
  # VERIFIED release binaries from their vendors. Grype reads the Go
  # module list embedded in each one and reports their dependencies
  # and the Go stdlib they were compiled against.
  #
  # Those findings are real for the vendor and unactionable here: all
  # four are already at their latest release (checked 2026-08-26), so
  # there is no newer build to move to. The only ways to clear them
  # are to build each tool from source with a current toolchain, or to
  # drop the tool. Neither is worth it for a dev-environment image.
  #
  # Scoped by LOCATION rather than by CVE deliberately. A CVE list goes
  # stale silently and starts hiding new findings; a path stops
  # matching the moment the tool moves or is removed, which is the
  # failure mode you want.
  #
  # REMOVE WHEN: the tool ships a release built with a patched
  # toolchain, and the pin in docker/Dockerfile.builder is bumped.
  - package:
      location: "/usr/local/bin/yq"
  - package:
      location: "/usr/local/bin/syft"
  - package:
      location: "/usr/local/bin/grype"
  - package:
      location: "/usr/local/bin/act"

  # ---------------------------------------------------------------
  # 2. Java version misdetection.
  #
  # The image installs Java 21 via mise. Grype's binary classifier
  # additionally reports packages named `jre` and `openjdk` at version
  # "1.10.0", which is not a version any JDK has ever shipped, and
  # matches them against CVEs from 2018-2021 whose fixes are 11.0.x.
  # Java 21 is not affected by CVE-2018-3149 or CVE-2021-35550.
  #
  # Scoped to the bogus version string only: a genuine finding against
  # the real `jdk 21.x` package still fails the gate.
  #
  # REMOVE WHEN: grype's java binary cataloger stops emitting the
  # phantom 1.10.0 package.
  - package:
      name: "jre"
      version: "1.10.0"
  - package:
      name: "openjdk"
      version: "1.10.0"

  # ---------------------------------------------------------------
  # Runtime image (docker/Dockerfile): no fix exists upstream.
  #
  # binutils (pulled in by build-base, which the agent needs to compile
  # code) and zlib: Alpine has published no fixed package for these
  # CVEs (grype reports fix-state "unknown"). The rule matches only that
# state: once
  # Alpine ships a fix, the rule stops matching, the gate fails, and the
  # image rebuild (which runs `apk upgrade`) picks the fix up.
  #
  # REMOVE WHEN: Alpine publishes fixed binutils / zlib packages.
  - package:
      name: "binutils"
      type: "apk"
    fix-state: "unknown"
  - package:
      name: "zlib"
      type: "apk"
    fix-state: "unknown"
  - package:
      name: "zlib-dev"
      type: "apk"
    fix-state: "unknown"

  # False positive: CVE-2015-8768 is for "click", the Ubuntu Touch
  # package-build tool, matched to the Python Click library (py3-click)
  # by CPE name alone. The Python library is not affected.
  #
  # REMOVE WHEN: grype stops matching click_project:click to py3-click.
  - vulnerability: "CVE-2015-8768"
    package:
      name: "py3-click"

  # CVE-2026-82049 in CPython: the only published fix is 3.14.0b1; no
  # 3.12.x release carries it yet. The affected interpreter is the
  # mise-managed python@3.12 the agent's coding tools use, not part of
  # the daemon. Scoped to that install path.
  #
  # REMOVE WHEN: a fixed 3.12.x ships (then bump the Dockerfile's
  # `mise use -g python@3.12` rebuild), or the image moves to 3.14.
  - vulnerability: "CVE-2026-82049"
    package:
      name: "python"
      location: "/home/rousseau/.local/share/mise/installs/python/**"

  # npm 12.2.0 (the latest release, pinned in docker/Dockerfile) bundles
  # undici 6.28.0 and brace-expansion 5.0.9 inside its own
  # node_modules; fixed versions exist upstream but no npm release
  # carries them yet, and bundled dependencies cannot be updated in
  # place. npm stays in the image because the agent uses it for
  # JavaScript projects. Scoped to npm's bundled copies only.
  #
  # REMOVE WHEN: an npm release bundles undici >= 6.28.1 and
  # brace-expansion >= 5.0.11 (bump NPM_VERSION in docker/Dockerfile).
  - vulnerability: "GHSA-rfgv-xxqx-mfg5"
    package:
      name: "undici"
      location: "/usr/local/lib/node_modules/npm/node_modules/undici/**"
  - vulnerability: "GHSA-6j4f-fj2g-mc7p"
    package:
      name: "brace-expansion"
      location: "/usr/local/lib/node_modules/npm/node_modules/brace-expansion/**"
  - vulnerability: "GHSA-qhr7-859c-m2p7"
    package:
      name: "brace-expansion"
      location: "/usr/local/lib/node_modules/npm/node_modules/brace-expansion/**"
